user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time';

  access_log  /var/log/nginx/access.log  main;

  sendfile           on;
  tcp_nopush         on;
  keepalive_timeout  65;
  server_tokens      off;
  client_max_body_size 100k;
  client_body_buffer_size 16k;

  # --- Rate limiting zones ---------------------------------------------------
  # general: 30 requests/second per IP for normal API traffic
  limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
  # auth:    5 requests/minute per IP for login/OTP endpoints (brute-force shield)
  limit_req_zone  $binary_remote_addr zone=auth:10m  rate=5r/m;
  # sync:    burst-friendly quota for bulk offline sync uploads
  limit_req_zone  $binary_remote_addr zone=sync:10m  rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/plain text/css application/json application/javascript
                     application/xml+rss text/javascript image/svg+xml;

  # Baseline security headers applied at the edge (the API also sets its own).
  map $sent_http_content_type $hsts {
    default "max-age=31536000; includeSubDomains";
  }

  # WebSocket upgrade helper used by proxy_params.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  include /etc/nginx/conf.d/*.conf;
}
