upstream web_upstream {
  server web:3000;
  keepalive 32;
}

upstream api_upstream {
  server api:4000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  # Baseline security headers for every response.
  add_header X-Content-Type-Options  "nosniff"        always;
  add_header X-Frame-Options         "DENY"           always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  limit_conn perip 60;

  # --- Swagger / OpenAPI -----------------------------------------------------
  location = /docs {
    limit_req zone=general burst=10 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy_params;
  }

  location /docs/ {
    limit_req zone=general burst=10 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy_params;
  }

  location = /docs-json {
    limit_req zone=general burst=10 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy_params;
  }

  # --- Authentication endpoints get the strictest quota -----------------------
  location /api/v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy_params;
  }

  # --- Offline sync uploads ---------------------------------------------------
  location = /api/v1/sync {
    limit_req zone=sync burst=40 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy_params;
  }

  # --- Everything under the API ----------------------------------------------
  location /api/ {
    limit_req zone=general burst=60 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy_params;
  }

  # --- Health probes (no rate limit) ------------------------------------------
  location = /healthz {
    access_log off;
    proxy_pass http://api_upstream/api/v1/health/ready;
    include /etc/nginx/proxy_params;
  }

  # --- Web app (static React/Vite bundle served by the web container) ---------
  location / {
    limit_req zone=general burst=60 nodelay;
    proxy_pass http://web_upstream;
    include /etc/nginx/proxy_params;
  }
}
