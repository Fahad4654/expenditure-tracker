# Served inside the `web` container (Vite static build), proxied by the edge
# nginx in `infrastructure/nginx/conf.d/default.conf`.
#
# NOTE on `add_header`: nginx drops inherited `add_header` directives from the
# enclosing scope as soon as a `location` declares its own. Security headers are
# therefore repeated in every location that sets a cache header.

server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options            "nosniff"                       always;
  add_header X-Frame-Options                   "DENY"                          always;
  add_header Referrer-Policy                   "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy                "camera=(), microphone=(), geolocation=()" always;
  add_header X-Permitted-Cross-Domain-Policies "none"                          always;

  # Vite emits content-hashed filenames under /assets/, so they are immutable.
  location /assets/ {
    add_header X-Content-Type-Options            "nosniff"                       always;
    add_header X-Frame-Options                   "DENY"                          always;
    add_header Referrer-Policy                   "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy                "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control                     "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # `add_header Content-Type` would produce a duplicate header alongside the
  # one derived from the (unknown) extension, so register the type properly.
  location = /manifest.webmanifest {
    types {
      application/manifest+json webmanifest;
    }
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # Single-page-app fallback: any unmatched path serves index.html so
  # react-router can render the route client-side.
  location / {
    add_header X-Content-Type-Options            "nosniff"                       always;
    add_header X-Frame-Options                   "DENY"                          always;
    add_header Referrer-Policy                   "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy                "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control                     "no-cache"                      always;
    try_files $uri $uri/ /index.html;
  }
}
