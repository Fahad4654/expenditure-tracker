name: expenditure-tracker

# Local development stack: PostgreSQL + Redis + API (watch) + Web (watch).
#
#   docker compose up --build
#
# Source is bind-mounted so edits hot-reload; dependencies live in named volumes
# so the bind mount does not hide them. Reset with `docker compose down -v`.
#
# NOTE: `POSTGRES_*` below are credentials for the *container* database. The
# repo-root `.env` points at your host database by default — override
# DATABASE_URL to point the apps at this container instead.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expenditure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expenditure}
      POSTGRES_DB: ${POSTGRES_DB:-expenditure_tracker}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/dev.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-expenditure}:${POSTGRES_PASSWORD:-expenditure}@postgres:5432/${POSTGRES_DB:-expenditure_tracker}?schema=public
      REDIS_URL: redis://redis:6379
      PUBLIC_API_URL: http://localhost:4000
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      CORS_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me-32chars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OTP_DEBUG_LOG: ${OTP_DEBUG_LOG:-true}
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm run build:packages && npm run db:generate && npm run db:deploy && npm run db:seed || true; exec npm run dev:api

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/dev.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      WEB_PORT: 3000
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm run build:packages && exec npm run dev:web

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  web_node_modules:
